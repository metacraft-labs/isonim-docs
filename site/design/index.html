<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Metacraft Docs Design System — Live Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!--
      Live editor over the isonim-docs `--docs-*` design-system token layer.
      Build the bundle with:
        nix develop ../../isonim -c \
          nim js --hints:off -o:build/design_editor.js main.nim
      then serve this directory (any static server) and open index.html.
      `mountEditor` attaches the editor shell to <body>.
    -->
    <script src="build/design_editor.js"></script>
  </body>
</html>
