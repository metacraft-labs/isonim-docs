<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Metacraft Docs Design System — Live Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!--
      Live editor over the isonim-docs `--docs-*` design-system token layer.
      Served over HTTP by `design/serve.nim` (run via `just design`), which
      hosts this page, serves the JS bundle under `/assets/`, and exposes the
      `/__isonim_save` POST route the editor's foundation "Save" calls. Being
      served same-origin is what makes that `fetch` (and therefore live,
      in-browser persistence to the docs token file) work.

      Build the bundle standalone with:
        nix develop ../../isonim -c \
          nim js --hints:off -o:build/design_editor.js main.nim
      `mountEditor` attaches the editor shell to <body>.
    -->
    <script src="/assets/design_editor.js"></script>
  </body>
</html>
