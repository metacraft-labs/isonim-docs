name: Deploy docs

# Publish the isonim-docs self-documentation site (site/) to GitHub Pages on
# every push to dev, this repo's mainline. Independent of the CI test workflow:
# docs are content and must publish regardless of unrelated test status. GitHub
# Pages must be enabled for this repo with the source set to the `gh-pages`
# branch (Settings -> Pages).

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

# Only one deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  build-and-deploy-docs:
    runs-on: [self-hosted, linux, x64]
    if: github.ref == 'refs/heads/dev'
    permissions:
      contents: write # push the built site to the gh-pages branch
    steps:
      # The primary checkout stays at GITHUB_WORKSPACE. The shared helper
      # restores all five declared adjacent source repositories from repro.lock;
      # the owning docs flake supplies the immutable development toolchain.
      - name: Check out isonim-docs
        uses: actions/checkout@v4

      - name: Setup owning docs environment and locked sibling sources
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}

      # ci/deploy/docs.sh builds site/ under the owning docs shell and force-pushes
      # site/public/ to the gh-pages orphan branch (origin = this repo; the
      # default GITHUB_TOKEN with contents:write authorizes the same-repo push).
      - name: Build + deploy self-docs to gh-pages
        env:
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }} # same-repo gh-pages push (contents:write)
        run: ./ci/deploy/docs.sh
