name: CI

on:
  push:
    branches: [dev, stable]
  pull_request:
    branches: [dev, stable]

jobs:
  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # Mirrors ../isonim/.github/workflows/ci.yml: the toolchain (Nim,
        # nimble, just) comes from the owning docs flake's pinned IsoNim shell,
        # so we matrix only over runner class, not Nim version.
        runner:
          [
            [self-hosted, linux, x64],
            [self-hosted, linux, arm64],
            [self-hosted, macos, arm64],
          ]
    runs-on: ${{ matrix.runner }}
    steps:
      # The primary checkout stays at GITHUB_WORKSPACE. The shared helper
      # restores all five declared adjacent source repositories from repro.lock;
      # the owning docs flake supplies the immutable development toolchain.
      - name: Check out isonim-docs
        uses: actions/checkout@v4

      - name: Setup owning docs environment and locked sibling sources
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}

      # The single entry point a clean checkout uses: the full
      # dual-target docs test matrix plus the compile smoke (see
      # isonim-docs/Justfile's `ci-docs` recipe).
      - name: Run isonim-docs CI
        run: dev-exec just ci-docs
