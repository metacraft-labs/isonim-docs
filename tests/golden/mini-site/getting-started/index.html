search-overlay-input" class="docs-search-overlay-input" placeholder="Search docs…" aria-label="Search documentation" value=""><div id="docs-search-overlay-results"><ul class="docs-search-results" role="listbox"></ul></div><div class="docs-search-overlay-hint">Press Esc to close</div></div></div></div><script id="docs-image-viewer">(function(){
try{
if(typeof document==='undefined'||!document.addEventListener){return;}
var FIG='docs-md-figure';
var IMG='docs-md-image';
var EXP='docs-md-image-expand';
var ZOOM='data-zoomable';
var OPEN='data-open';
var LOCK='data-docs-image-viewer-open';
var DIALOG_LABEL='Image viewer';
var CLOSE_LABEL='Close image viewer';
var overlay=null,overlayImg=null,overlayCaption=null,closeBtn=null,lastFocused=null;
var savedScrollX=0,savedScrollY=0;
function figureImage(fig){return fig.querySelector('.'+IMG);}
function measure(fig){
  var img=figureImage(fig);
  if(!img){return;}
  var natural=img.naturalWidth||0;
  var shown=img.clientWidth||0;
  var zoomable=(natural>0&&shown>0&&natural>shown+1)?'true':'false';
  if(fig.getAttribute(ZOOM)!==zoomable){fig.setAttribute(ZOOM,zoomable);}
}
function measureAll(){
  var list=document.querySelectorAll('.'+FIG);
  for(var i=0;i<list.length;i++){measure(list[i]);}
}
var pending=false;
function scheduleMeasure(){
  if(pending){return;}
  pending=true;
  var run=function(){pending=false;measureAll();};
  if(typeof requestAnimationFrame==='function'){requestAnimationFrame(run);}
  else{setTimeout(run,16);}
}
function isOpen(){return !!overlay&&overlay.getAttribute(OPEN)==='true';}
function closeViewer(){
  if(!isOpen()){return;}
  overlay.setAttribute(OPEN,'false');
  overlay.hidden=true;
  overlayImg.removeAttribute('src');
  try{document.documentElement.removeAttribute(LOCK);}catch(e){}
  var target=lastFocused;
  lastFocused=null;
  if(target&&target.focus&&document.contains(target)){
    try{target.focus({preventScroll:true});}catch(e){target.focus();}
  }
  if(typeof window!=='undefined'&&window.scrollTo){window.scrollTo(savedScrollX,savedScrollY);}
}
function buildOverlay(){
  if(overlay){return;}
  overlay=document.createElement('div');
  overlay.className='docs-image-overlay';
  overlay.setAttribute('role','dialog');
  overlay.setAttribute('aria-modal','true');
  overlay.setAttribute('aria-label',DIALOG_LABEL);
  overlay.setAttribute('tabindex','-1');
  overlay.setAttribute(OPEN,'false');
  overlay.hidden=true;
  closeBtn=document.createElement('button');
  closeBtn.setAttribute('type','button');
  closeBtn.className='docs-image-overlay-close';
  closeBtn.setAttribute('aria-label',CLOSE_LABEL);
  closeBtn.appendChild(document.createTextNode('\u00d7'));
  overlay.appendChild(closeBtn);
  overlayImg=document.createElement('img');
  overlayImg.className='docs-image-overlay-image';
  overlay.appendChild(overlayImg);
  overlayCaption=document.createElement('p');
  overlayCaption.className='docs-image-overlay-caption';
  overlay.appendChild(overlayCaption);
  closeBtn.addEventListener('click',function(ev){ev.preventDefault();closeViewer();});
  overlay.addEventListener('click',function(ev){if(ev.target===overlay){closeViewer();}});
  document.body.appendChild(overlay);
}
function openViewer(src,alt){
  buildOverlay();
  lastFocused=document.activeElement;
  savedScrollX=(typeof window!=='undefined'&&window.pageXOffset)||0;
  savedScrollY=(typeof window!=='undefined'&&window.pageYOffset)||0;
  overlayImg.setAttribute('src',src);
  overlayImg.setAttribute('alt',alt||'');
  overlay.setAttribute('aria-label',alt?(DIALOG_LABEL+': '+alt):DIALOG_LABEL);
  overlayCaption.textContent=alt||'';
  overlayCaption.hidden=!alt;
  overlay.hidden=false;
  overlay.setAttribute(OPEN,'true');
  try{document.documentElement.setAttribute(LOCK,'true');}catch(e){}
  closeBtn.focus();
}
document.addEventListener('click',function(ev){
  if(ev.defaultPrevented){return;}
  if(ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.altKey){return;}
  if(typeof ev.button==='number'&&ev.button!==0){return;}
  var t=ev.target;
  if(!t||!t.closest){return;}
  var fig=t.closest('.'+FIG);
  if(!fig){return;}
  if(fig.getAttribute(ZOOM)!=='true'){return;}
  var img=figureImage(fig);
  if(!img){return;}
  if(t!==img&&!t.closest('.'+EXP)){return;}
  ev.preventDefault();
  openViewer(img.currentSrc||img.getAttribute('src')||'',img.getAttribute('alt')||'');
});
document.addEventListener('keydown',function(ev){
  if(!isOpen()){return;}
  var k=ev.key;
  if(k==='Escape'||k==='Esc'){ev.preventDefault();closeViewer();return;}
  if(k==='Tab'){ev.preventDefault();if(closeBtn&&closeBtn.focus){closeBtn.focus();}}
},true);
document.addEventListener('load',function(ev){
  var t=ev.target;
  if(t&&t.classList&&t.classList.contains(IMG)){scheduleMeasure();}
},true);
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('resize',scheduleMeasure);
  window.addEventListener('load',scheduleMeasure);
}
if(typeof MutationObserver==='function'&&document.body){
  try{new MutationObserver(scheduleMeasure).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden','src']});}catch(e){}
}
document.addEventListener('DOMContentLoaded',scheduleMeasure);
scheduleMeasure();
}catch(e){}
})();</script></body></html>
